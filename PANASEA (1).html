const $=s=>document.querySelector(s);
const el=(t,p,...k)=>{const e=document.createElement(t);Object.assign(e,p||{});k.forEach(x=>e.append(x));return e};

/* Dokumen lengkap untuk disimpan: data album ikut tertanam di halaman, jadi semua orang yang buka link bisa melihatnya */

const tabOf=i=>i.t==='image'?'foto':i.t==='video'?'vid':'mus';
async function persist(items,msg,tb){
  try{if(msg)sessionStorage.setItem('msg',msg);if(tb)sessionStorage.setItem('tab',tb)}catch(e){}
  try{await ART.publish(doc(items))}
  catch(e){if(e&&e.code==='conflict')return;say('Gagal menyimpan ('+((e&&e.code)||'error')+'). Coba lagi.')}
}

function delBtn(label,fn,cls){
  const b=el('button',{className:cls||'btn ghost',textContent:label});let on=false;
  b.onclick=()=>{if(!on){on=true;b.textContent='Yakin hapus? Klik lagi';setTimeout(()=>{on=false;b.textContent=label},3500)}else fn()};
  return b;
}

/* ===== Tampilan ===== */
const TABS={foto:'#foto',vid:'#vid',mus:'#mus'};
function tab(w){for(const k in TABS){const on=k===w;$(TABS[k]).hidden=!on;$('#t-'+k).setAttribute('aria-selected',on)}}
Object.keys(TABS).forEach(k=>$('#t-'+k).onclick=()=>tab(k));

function card(i){
  const media=i.t==='image'?el('img',{src:url(i),alt:clean(i.n),loading:'lazy'}):el('video',{src:url(i)+'#t=0.1',preload:'metadata',muted:true});
  const t=el('button',{className:'tile',title:i.n,onclick:()=>openView(i)},media);
  if(i.t==='video')t.append(el('span',{className:'tag',textContent:'Video'}));
  const f=el('figure',{className:'card'},t);
  if(i.d||ED)f.append(el('button',{className:'cap'+(i.d?'':' none'),textContent:i.d||'Tambah deskripsi',onclick:()=>openView(i)}));
  return f;
}
/* Setiap 3 item = 1 album, dipisah garis pembatas */
function album(box,list,empty){
  box.textContent='';
  if(!list.length){box.append(el('p',{className:'empty',textContent:empty}));return}
  for(let n=0;n<list.length;n+=3){
    const g=list.slice(n,n+3);
    box.append(el('div',{className:'sep'},el('span',{textContent:'✿ Album '+(n/3+1)+(g.length<3?' ('+g.length+'/3)':'')+' ✿'})));
    const grid=el('div',{className:'grid'});g.forEach(i=>grid.append(card(i)));box.append(grid);
  }
}
function music(list){
  const L=$('#trks');L.textContent='';
  if(!list.length){L.append(el('p',{className:'empty',textContent:'Belum ada lagu.'}));return}
  list.forEach(i=>{
    const kids=[el('div',{className:'lbl',textContent:'♪ '+clean(i.n)}),el('audio',{src:url(i),controls:true,preload:'metadata'})];
    if(ED)kids.push(el('div',{className:'acts'},delBtn('Hapus',async()=>{try{await ASSETS.delete(i.id)}catch(e){}persist(S.items.filter(x=>x.id!==i.id),'','mus')},'btn ghost small')));
    L.append(el('div',{className:'trk'},...kids));
  });
}
function render(){
  const by=t=>S.items.filter(i=>i.t===t).sort((a,b)=>a.a-b.a);
  const ph=by('image'),vd=by('video'),au=by('audio');
  album($('#foto'),ph,'Belum ada foto.');album($('#vid'),vd,'Belum ada video.');music(au);
  $('#t-foto').textContent='Foto ('+ph.length+')';$('#t-vid').textContent='Video ('+vd.length+')';$('#t-mus').textContent='Musik ('+au.length+')';
}
$('#trks').addEventListener('play',e=>{$('#trks').querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);
$('#trks').addEventListener('ended',e=>{const as=[...$('#trks').querySelectorAll('audio')],n=as[as.indexOf(e.target)+1];if(n)n.play()},true);

/* Lihat foto/video + deskripsi */
function openView(i){
  const b=$('#dbody');b.textContent='';
  b.append(i.t==='image'?el('img',{src:url(i),alt:clean(i.n)}):el('video',{src:url(i),controls:true,autoplay:true}));
  const box=el('div',{className:'edit'});
  if(ED){
    const ta=el('textarea',{className:'desc',rows:3,placeholder:'Tulis deskripsi di sini',value:i.d||''});
    box.append(ta,el('div',{className:'acts'},
      el('button',{className:'btn',textContent:'Simpan deskripsi',onclick:()=>{$('#dlg').close();persist(S.items.map(x=>x.id===i.id?{...x,d:ta.value.trim()}:x),'',tabOf(i))}}),
      delBtn('Hapus berkas',async()=>{$('#dlg').close();try{await ASSETS.delete(i.id)}catch(e){}persist(S.items.filter(x=>x.id!==i.id),'',tabOf(i))})));
  }else box.append(el('p',{className:'view',textContent:i.d||''}));
  b.append(box);$('#dlg').showModal();
}
$('#dclose').onclick=()=>$('#dlg').close();
$('#dlg').addEventListener('close',()=>{$('#dbody').textContent=''});
$('#dlg').addEventListener('click',e=>{if(e.target===$('#dlg'))$('#dlg').close()});

/* ===== Upload (hanya pemilik/editor) ===== */
function classify(f){
  const t=f.type||'',n=f.name.toLowerCase(),big=f.size>20*1048576,L='lebih dari 20 MB';
  if(t.startsWith('image/'))return{k:'image'};
  if(/\.m4a$/.test(n)||t==='audio/mp4'||t==='audio/x-m4a')return big?{err:L}:{k:'audio',type:'video/mp4'};
  if(t==='video/mp4'||t==='video/webm'||/\.(mp4|webm)$/.test(n))return big?{err:L}:{k:'video',type:(t==='video/webm'||/webm$/.test(n))?'video/webm':'video/mp4'};
  if(t.startsWith('video/'))return{err:'video harus MP4 atau WebM'};
  if(t.startsWith('audio/')||/\.(mp3|wav|ogg|flac|aac)$/.test(n))return{err:'lagu harus M4A'};
  return{err:'jenis berkas tidak didukung'};
}
async function shrink(f){
  const bmp=await createImageBitmap(f),s=Math.min(1,1800/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
  return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('x')),'image/jpeg',.85));
}

  pending=[];const bad=[];
  for(const f of files){const c=classify(f);if(c.err)bad.push(f.name+' ('+c.err+')');else pending.push({f,k:c.k,type:c.type})}
  if(bad.length)say('Dilewati: '+bad.join(', ')+'.');
  if(pending.length)openUp();
}

  const L=$('#uplist');L.textContent='';const urls=[];

    else{const u=URL.createObjectURL(p.f);urls.push(u);th=p.k==='image'?el('img',{src:u,alt:''}):el('video',{src:u+'#t=0.1',preload:'metadata',muted:true})}
    const info=el('div',{className:'upf'},el('div',{className:'nm',textContent:p.f.name}));
    p.ta=p.k==='audio'?null:el('textarea',{className:'desc',rows:2,placeholder:'Deskripsi untuk '+p.f.name});
    if(p.ta)info.append(p.ta);
    L.append(el('div',{className:'uprow'},th,info));
  });
  $('#up')._urls=urls;$('#up').showModal();
}
$('#up').addEventListener('close',()=>{($('#up')._urls||[]).forEach(u=>URL.revokeObjectURL(u))});
$('#upcancel').onclick=()=>{pending=[];$('#up').close()};
$('#upsave').onclick=async()=>{
  const list=pending.map(p=>({f:p.f,k:p.k,type:p.type,d:p.ta?p.ta.value.trim():''}));
  $('#up').close();pending=[];
  const added=[],bad=[];
  for(let n=0;n<list.length;n++){
    const p=list[n];say('Mengunggah '+(n+1)+' dari '+list.length+'…');
    try{
      const gif=p.f.type==='image/gif';
      const blob=p.k==='image'&&!gif?await shrink(p.f):p.f;
      const r=await ASSETS.upload(blob,{type:p.k==='image'?(gif?'image/gif':'image/jpeg'):p.type});
      added.push({id:r.id,t:p.k,n:p.f.name,d:p.d,a:Date.now()+n});
    }catch(e){
      const c=e&&e.code;
      bad.push(p.f.name+' ('+(c==='quota_or_state'?'penyimpanan penuh':c==='too_large'?'terlalu besar':c?'gagal diunggah':'foto tidak bisa dibaca')+')');
    }
  }
  if(!added.length){say('Tidak ada yang berhasil: '+bad.join(', '));return}
  persist([...S.items,...added],bad.length?'Sebagian gagal: '+bad.join(', '):'',list[0].k==='image'?'foto':list[0].k==='video'?'vid':'mus');
};
$('#add').onclick=()=>$('#file').click();
$('#file').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
const dz=$('#drop');
['dragenter','dragover'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>addFiles([...e.dataTransfer.files]));

/* ===== Mulai ===== */
render();
say('Dibagikan oleh pemilik halaman ini.');
try{const t=sessionStorage.getItem('tab');if(t&&TABS[t])tab(t);sessionStorage.removeItem('tab')}catch(e){}
(async()=>{
  try{if(window.claude&&claude.use)[ART,ASSETS]=await Promise.all([claude.use('artifact'),claude.use('assets')])}catch(e){}
  ED=!!(ART&&ASSETS);
  if(ED){$('#add').hidden=false;$('#drop').hidden=false;say('Tersimpan di web ini dan terlihat oleh siapa saja yang kamu beri link. Video MP4 atau WebM maks. 20 MB, lagu format M4A.')}
  render();
  try{const m=sessionStorage.getItem('msg');if(m)say(m);sessionStorage.removeItem('msg')}catch(e){}
})();
})()</script><script>(()=>{

items:end;justify-content:space-between}\nh1{margin:0;font-size:clamp(2.6rem,10vw,4.6rem);line-height:1;letter-spacing:-.04em;font-weight:800;color:var(--acc);text-shadow:3px 3px 0 var(--hi)}\n.sub{margin:8px 0 0;color:var(--mute)}\n.stk{display:inline-block;margin-top:12px;padding:4px 14px;border:2px solid var(--ink);border-radius:999px;background:var(--hi);font-weight:800;transform:rotate(-3deg);box-shadow:2px 2px 0 var(--ink)}\n\n.btn{background:var(--acc);color:var(--onacc);border:2px solid var(--ink);border-radius:999px;padding:11px 22px;font-weight:800;box-shadow:3px 3px 0 var(--ink)}\n.btn:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}\n.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}\n.btn.ghost{background:var(--panel);color:var(--ink)}\n.btn.small{padding:5px 14px;font-size:.85rem;box-shadow:2px 2px 0 var(--ink)}\n\nnav{max-width:1000px;margin:0 auto;padding:0 20px 8px;display:flex;gap:10px}\nnav button{border:2px solid var(--ink);border-radius:999px;padding:8px 22px;background:var(--panel);font-weight:800}\nnav button[aria-selected=\"true\"]{background:var(--acc);color:var(--onacc);box-shadow:3px 3px 0 var(--ink)}\nmain{max-width:1000px;margin:0 auto;padding:20px}\n.note{color:var(--mute);font-size:.85rem;margin-top:20px}\n.empty{color:var(--mute);padding:24px 4px;grid-column:1/-1}\n\n/* Galeri */\n.drop{border:3px dashed var(--acc);background:var(--panel);border-radius:22px;padding:28px 16px;text-align:center;font-weight:600}\n.drop::before{content:\"✿ \";color:var(--acc)}\n.drop.over{background:var(--hi)}\n.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:14px}\n.sep{display:flex;align-items:center;gap:12px;margin-top:30px;font-weight:800;color:var(--acc);white-space:nowrap}\n.sep:first-child{margin-top:18px}\n.sep::before,.sep::after{content:\"\";flex:1;border-top:3px dotted var(--acc)}\n.card{margin:0;background:var(--panel);border:2px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:5px 5px 0 var(--ink)}\n.card:nth-child(3n+1){transform:rotate(-1.2deg)}\n.card:nth-child(3n+2){transform:rotate(1deg)}\n.card:hover{transform:rotate(0) translateY(-3px)}\n.tile{position:relative;display:block;width:100%;aspect-ratio:1;overflow:hidden;background:var(--line);border:0;padding:0}\n.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}\n.tag{position:absolute;left:8px;bottom:8px;background:var(--acc);color:var(--onacc);border:2px solid var(--ink);border-radius:999px;font-size:.75rem;font-weight:800;padding:1px 10px}\n.cap{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;width:100%;text-align:left;background:none;border:0;border-top:2px solid var(--ink);padding:10px 12px;font-size:.9rem;font-weight:600;line-height:1.35}\n.cap.none{color:var(--mute);font-style:italic;font-weight:400}\n\n/* Musik */\n.trks{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:20px}\n.trk{background:var(--panel);border:2px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);padding:14px}\n.trk .lbl{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px}\n.trk audio{display:block;width:100%;height:44px;accent-color:var(--acc)}\n\n@media (max-width:560px){.grid{gap:10px}.card{border-radius:14px;box-shadow:3px 3px 0 var(--ink)}.cap{font-size:.75rem;padding:8px}nav button{padding:8px 16px}}\n\n/* Dialog */\ndialog{border:2px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:0;background:var(--panel);color:var(--ink);max-width:min(94vw,1000px);max-height:90vh}\ndialog::backdrop{background:rgba(40,0,15,.75)}\ndialog img,dialog video{display:block;max-width:100%;max-height:60vh;margin:0 auto}\ndialog .close{display:block;margin:8px 8px 8px auto;background:var(--line);border:0;border-radius:8px;padding:6px 14px}\n.edit{padding:4px 16px 16px}\n.desc{width:100%;background:var(--bg);border:2px solid var(--ink);border-radius:14px;padding:10px;resize:vertical}\n.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}\n.upin{padding:20px;width:min(92vw,560px)}\n.upin h2{margin:0;font-size:1.4rem}\n.uprow{display:flex;gap:12px;margin-top:14px;align-items:flex-start}\n.uprow img,.uprow video{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none;margin:0}\n.upf{flex:1;min-width:0}\n.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:4px}\n\n@media (prefers-reduced-motion:no-preference){.btn,.card{transition:transform .15s,box-shadow .15s}}\n\n.ph{width:84px;height:84px;flex:none;display:grid;place-items:center;font-size:2rem;background:var(--hi);border-radius:10px}\n.edit p.view{margin:10px 0 0;font-weight:600}\n.edit p.view:empty{display:none}\n",BODY="<header>\n  <div>\n    <h1>PANNCHY<\/h1>\n    <p class=\"sub\">All about you<\/p>\n    <span class=\"stk\">U ARE MY PANASEA<\/span>\n  <\/div>\n  <button class=\"btn\" id=\"add\" hidden>Upload file<\/button>\n  <input type=\"file\" id=\"file\" multiple accept=\"image/*,video/*,audio/*\" hidden>\n<\/header>\n\n<nav role=\"tablist\">\n  <button role=\"tab\" id=\"t-foto\" aria-selected=\"true\">Foto<\/button>\n  <button role=\"tab\" id=\"t-vid\" aria-selected=\"false\">Video<\/button>\n  <button role=\"tab\" id=\"t-mus\" aria-selected=\"false\">Musik<\/button>\n<\/nav>\n\n<main>\n  <div class=\"drop\" id=\"drop\" hidden>Seret foto, video, atau lagu ke sini, atau pilih lewat tombol Upload file.<\/div>\n  <section id=\"foto\"><\/section>\n  <section id=\"vid\" hidden><\/section>\n  <section id=\"mus\" hidden><div class=\"trks\" id=\"trks\"><\/div><\/section>\n  <p class=\"note\" id=\"note\"><\/p>\n<\/main>\n\n\n<dialog id=\"dlg\"><button class=\"close\" id=\"dclose\">Tutup<\/button><div id=\"dbody\"><\/div><\/dialog>\n\n\n<dialog id=\"up\">\n  <div class=\"upin\">\n    <h2>Tambah deskripsi<\/h2>\n    <p class=\"sub\">Opsional. Bisa diubah lagi nanti.<\/p>\n    <div id=\"uplist\"><\/div>\n    <div class=\"acts\">\n      <button class=\"btn\" id=\"upsave\">Simpan semua<\/button>\n      <button class=\"btn ghost\" id=\"upcancel\">Batal<\/button>\n    <\/div>\n  <\/div>\n<\/dialog>\n\n";
const $=s=>document.querySelector(s);
const el=(t,p,...k)=>{const e=document.createElement(t);Object.assign(e,p||{});k.forEach(x=>e.append(x));return e};
const clean=n=>n.replace(/\.[^.]+$/,'');
const url=i=>'/_blob/'+i.id;
const SRC=document.getElementById('src').textContent;
let S={items:[]};try{S=JSON.parse(document.getElementById('state').textContent)}catch(e){}
document.head.append(el('style',{textContent:CSS}));
document.body.insertAdjacentHTML('afterbegin',BODY);
let ED=false,ART=null,ASSETS=null,pending=[];
const say=m=>{$('#note').textContent=m};

/* Dokumen lengkap untuk disimpan: data album ikut tertanam di halaman, jadi semua orang yang buka link bisa melihatnya */
const doc=items=>PRE+JSON.stringify({items}).replace(/[<]/g,'\\u003c')+'<\/script><script type="text/plain" id="src">'+SRC+'<\/script><script>'+SRC+'<\/script><\/body><\/html>';
const tabOf=i=>i.t==='image'?'foto':i.t==='video'?'vid':'mus';
async function persist(items,msg,tb){
  try{if(msg)sessionStorage.setItem('msg',msg);if(tb)sessionStorage.setItem('tab',tb)}catch(e){}
  try{await ART.publish(doc(items))}
  catch(e){if(e&&e.code==='conflict')return;say('Gagal menyimpan ('+((e&&e.code)||'error')+'). Coba lagi.')}
}

function delBtn(label,fn,cls){
  const b=el('button',{className:cls||'btn ghost',textContent:label});let on=false;
  b.onclick=()=>{if(!on){on=true;b.textContent='Yakin hapus? Klik lagi';setTimeout(()=>{on=false;b.textContent=label},3500)}else fn()};
  return b;
}

/* ===== Tampilan ===== */
const TABS={foto:'#foto',vid:'#vid',mus:'#mus'};
function tab(w){for(const k in TABS){const on=k===w;$(TABS[k]).hidden=!on;$('#t-'+k).setAttribute('aria-selected',on)}}
Object.keys(TABS).forEach(k=>$('#t-'+k).onclick=()=>tab(k));

function card(i){
  const media=i.t==='image'?el('img',{src:url(i),alt:clean(i.n),loading:'lazy'}):el('video',{src:url(i)+'#t=0.1',preload:'metadata',muted:true});
  const t=el('button',{className:'tile',title:i.n,onclick:()=>openView(i)},media);
  if(i.t==='video')t.append(el('span',{className:'tag',textContent:'Video'}));
  const f=el('figure',{className:'card'},t);
  if(i.d||ED)f.append(el('button',{className:'cap'+(i.d?'':' none'),textContent:i.d||'Tambah deskripsi',onclick:()=>openView(i)}));
  return f;
}
/* Setiap 3 item = 1 album, dipisah garis pembatas */
function album(box,list,empty){
  box.textContent='';
  if(!list.length){box.append(el('p',{className:'empty',textContent:empty}));return}
  for(let n=0;n<list.length;n+=3){
    const g=list.slice(n,n+3);
    box.append(el('div',{className:'sep'},el('span',{textContent:'✿ Album '+(n/3+1)+(g.length<3?' ('+g.length+'/3)':'')+' ✿'})));
    const grid=el('div',{className:'grid'});g.forEach(i=>grid.append(card(i)));box.append(grid);
  }
}
function music(list){
  const L=$('#trks');L.textContent='';
  if(!list.length){L.append(el('p',{className:'empty',textContent:'Belum ada lagu.'}));return}
  list.forEach(i=>{
    const kids=[el('div',{className:'lbl',textContent:'♪ '+clean(i.n)}),el('audio',{src:url(i),controls:true,preload:'metadata'})];
    if(ED)kids.push(el('div',{className:'acts'},delBtn('Hapus',async()=>{try{await ASSETS.delete(i.id)}catch(e){}persist(S.items.filter(x=>x.id!==i.id),'','mus')},'btn ghost small')));
    L.append(el('div',{className:'trk'},...kids));
  });
}
function render(){
  const by=t=>S.items.filter(i=>i.t===t).sort((a,b)=>a.a-b.a);
  const ph=by('image'),vd=by('video'),au=by('audio');
  album($('#foto'),ph,'Belum ada foto.');album($('#vid'),vd,'Belum ada video.');music(au);
  $('#t-foto').textContent='Foto ('+ph.length+')';$('#t-vid').textContent='Video ('+vd.length+')';$('#t-mus').textContent='Musik ('+au.length+')';
}
$('#trks').addEventListener('play',e=>{$('#trks').querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);
$('#trks').addEventListener('ended',e=>{const as=[...$('#trks').querySelectorAll('audio')],n=as[as.indexOf(e.target)+1];if(n)n.play()},true);

/* Lihat foto/video + deskripsi */
function openView(i){
  const b=$('#dbody');b.textContent='';
  b.append(i.t==='image'?el('img',{src:url(i),alt:clean(i.n)}):el('video',{src:url(i),controls:true,autoplay:true}));
  const box=el('div',{className:'edit'});
  if(ED){
    const ta=el('textarea',{className:'desc',rows:3,placeholder:'Tulis deskripsi di sini',value:i.d||''});
    box.append(ta,el('div',{className:'acts'},
      el('button',{className:'btn',textContent:'Simpan deskripsi',onclick:()=>{$('#dlg').close();persist(S.items.map(x=>x.id===i.id?{...x,d:ta.value.trim()}:x),'',tabOf(i))}}),
      delBtn('Hapus berkas',async()=>{$('#dlg').close();try{await ASSETS.delete(i.id)}catch(e){}persist(S.items.filter(x=>x.id!==i.id),'',tabOf(i))})));
  }else box.append(el('p',{className:'view',textContent:i.d||''}));
  b.append(box);$('#dlg').showModal();
}
$('#dclose').onclick=()=>$('#dlg').close();
$('#dlg').addEventListener('close',()=>{$('#dbody').textContent=''});
$('#dlg').addEventListener('click',e=>{if(e.target===$('#dlg'))$('#dlg').close()});

/* ===== Upload (hanya pemilik/editor) ===== */
function classify(f){
  const t=f.type||'',n=f.name.toLowerCase(),big=f.size>20*1048576,L='lebih dari 20 MB';
  if(t.startsWith('image/'))return{k:'image'};
  if(/\.m4a$/.test(n)||t==='audio/mp4'||t==='audio/x-m4a')return big?{err:L}:{k:'audio',type:'video/mp4'};
  if(t==='video/mp4'||t==='video/webm'||/\.(mp4|webm)$/.test(n))return big?{err:L}:{k:'video',type:(t==='video/webm'||/webm$/.test(n))?'video/webm':'video/mp4'};
  if(t.startsWith('video/'))return{err:'video harus MP4 atau WebM'};
  if(t.startsWith('audio/')||/\.(mp3|wav|ogg|flac|aac)$/.test(n))return{err:'lagu harus M4A'};
  return{err:'jenis berkas tidak didukung'};
}
async function shrink(f){
  const bmp=await createImageBitmap(f),s=Math.min(1,1800/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
  return new Promise((ok,no)=>c.toBlob(b=>b?ok(b):no(new Error('x')),'image/jpeg',.85));
}
function addFiles(files){
  if(!ED)return;
  pending=[];const bad=[];
  for(const f of files){const c=classify(f);if(c.err)bad.push(f.name+' ('+c.err+')');else pending.push({f,k:c.k,type:c.type})}
  if(bad.length)say('Dilewati: '+bad.join(', ')+'.');
  if(pending.length)openUp();
}
function openUp(){
  const L=$('#uplist');L.textContent='';const urls=[];
  pending.forEach(p=>{
    let th;
    if(p.k==='audio')th=el('div',{className:'ph',textContent:'♪'});
    else{const u=URL.createObjectURL(p.f);urls.push(u);th=p.k==='image'?el('img',{src:u,alt:''}):el('video',{src:u+'#t=0.1',preload:'metadata',muted:true})}
    const info=el('div',{className:'upf'},el('div',{className:'nm',textContent:p.f.name}));
    p.ta=p.k==='audio'?null:el('textarea',{className:'desc',rows:2,placeholder:'Deskripsi untuk '+p.f.name});
    if(p.ta)info.append(p.ta);
    L.append(el('div',{className:'uprow'},th,info));
  });
  $('#up')._urls=urls;$('#up').showModal();
}
$('#up').addEventListener('close',()=>{($('#up')._urls||[]).forEach(u=>URL.revokeObjectURL(u))});
$('#upcancel').onclick=()=>{pending=[];$('#up').close()};
$('#upsave').onclick=async()=>{
  const list=pending.map(p=>({f:p.f,k:p.k,type:p.type,d:p.ta?p.ta.value.trim():''}));
  $('#up').close();pending=[];
  const added=[],bad=[];
  for(let n=0;n<list.length;n++){
    const p=list[n];say('Mengunggah '+(n+1)+' dari '+list.length+'…');
    try{
      const gif=p.f.type==='image/gif';
      const blob=p.k==='image'&&!gif?await shrink(p.f):p.f;
      const r=await ASSETS.upload(blob,{type:p.k==='image'?(gif?'image/gif':'image/jpeg'):p.type});
      added.push({id:r.id,t:p.k,n:p.f.name,d:p.d,a:Date.now()+n});
    }catch(e){
      const c=e&&e.code;
      bad.push(p.f.name+' ('+(c==='quota_or_state'?'penyimpanan penuh':c==='too_large'?'terlalu besar':c?'gagal diunggah':'foto tidak bisa dibaca')+')');
    }
  }
  if(!added.length){say('Tidak ada yang berhasil: '+bad.join(', '));return}
  persist([...S.items,...added],bad.length?'Sebagian gagal: '+bad.join(', '):'',list[0].k==='image'?'foto':list[0].k==='video'?'vid':'mus');
};
$('#add').onclick=()=>$('#file').click();
$('#file').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
const dz=$('#drop');
['dragenter','dragover'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>addFiles([...e.dataTransfer.files]));

/* ===== Mulai ===== */
render();
say('Dibagikan oleh pemilik halaman ini.');
try{const t=sessionStorage.getItem('tab');if(t&&TABS[t])tab(t);sessionStorage.removeItem('tab')}catch(e){}
(async()=>{
  try{if(window.claude&&claude.use)[ART,ASSETS]=await Promise.all([claude.use('artifact'),claude.use('assets')])}catch(e){}
  ED=!!(ART&&ASSETS);
  if(ED){$('#add').hidden=false;$('#drop').hidden=false;say('Tersimpan di web ini dan terlihat oleh siapa saja yang kamu beri link. Video MP4 atau WebM maks. 20 MB, lagu format M4A.')}
  render();
  try{const m=sessionStorage.getItem('msg');if(m)say(m);sessionStorage.removeItem('msg')}catch(e){}
})();
})()</script></body></html>
